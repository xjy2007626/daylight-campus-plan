<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243d36"><title>日常有序 · 我的成长日课</title><link rel="stylesheet" href="style.css?v=3"><link rel="stylesheet" href="fitness.css?v=3"><link rel="stylesheet" href="daily.css?v=3"><link rel="stylesheet" href="ui.css?v=4"></head>
<body><aside><a class="brand" href="#today"><span class="brandmark">日</span><b>日常有序<small>DAY BY DAY</small></b></a><div class="navlabel">我的成长空间</div><nav><button data-page="today" class="active">◷ <span>今日安排</span></button><button data-page="week">▦ <span>一周节奏</span></button><button data-page="training">↗ <span>训练与恢复</span></button><button data-page="notes">▤ <span>课程与笔记</span></button><button data-page="settings">⚙ <span>计划设置</span></button></nav><div class="sidebottom"><span class="dot"></span> 给成长留一点余地<p>每天推进一点，<br>也给身体恢复的时间。</p><small>个人日课 · 中午三分化版</small></div></aside>
<main><header><div id="breadcrumb">我的日课 / 今日安排</div><div class="headeractions"><button id="export" class="quiet">导出备份 ↓</button><button id="add" class="primary">＋ 添加安排</button></div></header><div id="app"></div><footer>记录保存在当前浏览器，不会自动跨设备同步。定期导出备份，让进度留得住。</footer></main><div id="toast" role="status"></div>
<dialog id="eventDialog"><form id="eventForm"><div class="dialogtitle"><h2>编辑我的安排</h2><button type="button" id="closeDialog" class="quiet">关闭</button></div><input name="id" type="hidden"><label>事项名称<input name="title" required maxlength="100" placeholder="例如：高数错题整理"></label><div class="formrow"><label>开始时间<input name="start" type="time" required></label><label>结束时间<input name="end" type="time" required></label></div><div class="formrow"><label>分类<select name="type"><option value="study">高数 / 英语</option><option value="class">学校课程</option><option value="run">校园跑</option><option value="gym">抗阻训练</option><option value="personal">个人课程</option><option value="fixed">固定事务</option><option value="rest">休息 / 生活</option></select></label><label>重复<select name="repeat"><option value="once">仅选中这一天</option><option value="weekly">每周当天</option><option value="daily">每天</option></select></label></div><label>备注<textarea name="note" rows="3" maxlength="2000"></textarea></label><p class="muted">修改重复事项会作用于整个重复计划；课表节次时间请按学校实际校正。</p><div class="dialogactions"><button type="button" id="deleteEvent" class="danger">删除此安排</button><button class="primary" type="submit">保存安排</button></div></form></dialog>
<script src="app.js?v=3"></script><script src="fitness.js?v=3"></script><script src="daily.js?v=3"></script><script src="ui.js?v=4"></script></body></html>
